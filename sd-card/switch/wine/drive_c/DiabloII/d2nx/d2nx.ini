; ============================================================================
; D2-Autorun 0.4.4 - configuracao do port (vale para todos os cores e mods)
; Para mudar so um mod, crie uma secao com o nome exato da pasta dele
; (o mesmo nome do ActiveFolder do D2SE.ini). Exemplo no final do arquivo.
; ============================================================================

[Video]
; auto  = D2GL (60 FPS, tela cheia) nos cores e mods com D2GL; Glide Sven nos demais
; d2gl  = forca o D2GL (resolucao 1280x720 nativa do Switch)
; sven  = Glide simples Sven (use se preferir o renderizador classico super estavel)
; ddraw = DirectDraw
; nativo = nao mexe no video da entrada
Renderizador=auto

; ---- Perfil de desempenho do D2GL no Switch ----
; Qualquer chave do d2gl.ini pode ser trocada aqui com o prefixo "d2gl.". Valem a cada boot.
; FXAA e nitidez (sharpen) sao passes de tela cheia sobre o quadro pronto: custam GPU no Tegra e chamadas GL por
; quadro (medido no Ryujinx: -17% de chamadas GL e -18% do tempo em glBufferSubData). Desligados por padrao.
; Para voltar ao visual anterior: d2gl.fxaa=true e d2gl.sharpen=true
d2gl.fxaa=false
d2gl.sharpen=false

; Perfil do D2GL aplicado no d2gl.ini de cada entrada:
; d2gl.vsync=true
; d2gl.motion_prediction=true
; d2gl.shader_preset=

[Controle]
; d2nxpad = controle estilo Diablo II Resurrected (padrao, 100% compativel com Switch)
; nativo  = nao carrega o controle novo (o mod usa o que ele tiver)
Controle=d2nxpad
; 1 = troca o D2Pad.dll do mod pelo D2NXPad (o original fica como D2Pad.dll.original-d2pad;
;     o ChainLoad do D2Pad.ini do mod continua sendo carregado, ex.: P113c do Median)
; 0 = devolve o D2Pad.dll original do mod
SubstituirD2Pad=1
; Project Diablo 2 tem controle proprio: o D2NXPad nao e carregado nele
ControleNoPD2=0

[Geral]
; 0 = padrao recomendado (ganchos necessarios para estabilidade e auto-fechar caixas de erro)
ModoSeguro=0

[D2SE]
; 1 = aperta "Start Plugin" sozinho
IniciarAutomatico=1

; ---- Exemplo: rodar o Median XL com o wrapper Glide simples Sven ----
; [D2SE_Median XL Sigma 2.9.2]
; Renderizador=sven

