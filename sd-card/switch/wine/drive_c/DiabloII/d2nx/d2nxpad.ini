; ============================================================================
; D2NXPad 1.1.1 - controle estilo Diablo II Resurrected (Nintendo Switch)
; Botoes com nomes do Switch (posicionais). Apague para restaurar o padrao.
; Acoes: ATTACK SKILL:n RIGHT KEY:<tecla> KEY:SHIFT+<tecla> HOLD:<tecla> LCLICK RCLICK
;        SHIFTCLICK CTRLCLICK SHIFTRCLICK LAYER PLUS NAV POPUP_R POPUP_L NONE
; Teclas: A-Z 0-9 F1-F12 TAB SPACE ENTER ESC SHIFT CTRL ALT UP DOWN LEFT RIGHT
; ============================================================================
; ============================================================================
; [Gameplay] - Modificadores de Experiencia, Queda de Itens e Ouro
; Dica Switch: Segure ZL e aperte Minus no controle (ou aperte - e + juntos)
; para abrir o MENU INTERATIVO DE GAMEPLAY diretamente na tela do jogo!
; Pode também alterar os valores aqui a qualquer momento.
; ============================================================================
[Gameplay]
; Multiplicador de Experiencia (padrao: 2.0 = Dobro de XP)
MultiplicadorXP=2.0

; Multiplicador de Queda de Runas (padrao: 2.0 = Dobro de Runas)
MultiplicadorRunas=2.0

; Facilidade de Queda de Itens Unicos (padrao: 1.5 = 50% mais facil)
MultiplicadorUnicos=1.5

; Facilidade de Queda de Itens Raros (padrao: 1.5 = 50% mais facil)
MultiplicadorRaros=1.5

; Ouro inicial no inventario para personagens lv1 (padrao: 10000 = maximo no lv1)
OuroInicial=10000

[Geral]
Ativo=1
; -1 = primeiro controle conectado
Controle=-1
Debug=1

[Movimento]
; 1 = ordem estavel no centro das 64 direcoes do jogo (sem tremer nas diagonais); 0 = ordem antiga
ModoOrdem=1
ZonaMortaEsquerda=0.20
; distancia do ponto de andar, em pixels do jogo
RaioAndar=120
; altura do centro do personagem em relacao ao meio da tela (pixels)
AjusteCentroY=-28
; 1 = entra no jogo correndo (L3 alterna andar/correr)
SempreCorrer=1

[Mira]
; mira automatica no monstro mais proximo na direcao do analogico (como no D2R)
MiraAssistida=1
Alcance=25
Cone=110
CorpoACorpo=4
Interagir=12
AlturaCorpo=26
DistanciaSemAlvo=160
; sem alvo: ataca parado (Shift) na direcao em que olha
AtacarParado=1
RepetirMs=350
AtrasoHabilidadeMs=40

[Cursor]
ZonaMortaDireita=0.18
; telas por segundo
Velocidade=1.2
Curva=2.0
Gatilho=0.35
; direcional nos paineis: tamanho do passo (uma casa do inventario = 29)
PassoNav=29
AtrasoNav=260
RepeticaoNav=90
; deslocamento da camera com painel aberto (0 = automatico)
DeslocamentoPainel=0

; ---- Jogo (igual ao D2R do Switch) ----
; B = habilidade 2 / interagir (ataque principal). Y, A, X, R, ZR = habilidades 1, 3, 4, 5, 6.
; ZL segurado = segunda barra. L = mostrar itens. Direcional = cinto. + = menu, - = mapa.
; As habilidades usam as teclas F1-F8 do jogo: na tela de habilidades (+ e ZR), passe o cursor
; sobre a habilidade e aperte o botao para gravar.
[Jogo]
; analogico esquerdo = movimento nativo (sem mouse); A/X/B usam o alvo detectado na tela
A=ATTACK
X=RIGHT
B=INTERACT
Y=KEY:I
R=SKILL:4
ZR=SKILL:5
ZL=LAYER
L=HOLD:ALT
Plus=PLUS
Minus=KEY:TAB
L3=KEY:R
R3=KEY:W
Left=KEY:1
Right=KEY:2
Down=KEY:3
Up=KEY:4

; segurando ZL
[Jogo.ZL]
Y=SKILL:6
A=SKILL:7
X=SKILL:8
R=RIGHT
ZR=RIGHT
B=ATTACK
Left=KEY:SHIFT+1
Right=KEY:SHIFT+2
Down=KEY:SHIFT+3
Up=KEY:SHIFT+4

; segurando + (toque rapido no + = ESC/menu do jogo)
[Jogo.Mais]
Y=KEY:I
X=KEY:C
A=KEY:T
B=KEY:Q
R=KEY:O
L=KEY:P
ZR=POPUP_R
ZL=POPUP_L
Up=KEY:H
Down=KEY:M
Left=KEY:K
Right=KEY:ENTER

; inventario, bau, cubo, loja, troca, mercenario, habilidades, personagem
; inventario, bau, cubo, loja, menu do NPC: o direcional pula de item em item / casa em casa / opcao em opcao
; (o analogico continua movendo o cursor livre). Loja: A num item abre a caixa Sim/Nao com o cursor no Sim;
; direcional alterna Sim/Nao, B = Nao. Botao "Organizar" ao lado do inventario (ou menu de cheats).
[Painel]
A=LCLICK
Y=RCLICK
X=SHIFTCLICK
B=KEY:ESC
L=CTRLCLICK
R=SHIFTRCLICK
ZL=LAYER
ZR=RCLICK
Plus=KEY:ESC
Minus=KEY:TAB
L3=KEY:I
R3=KEY:C
Up=NAV
Down=NAV
Left=NAV
Right=NAV

; fora da partida (menus, selecao de personagem)
[Menu]
A=LCLICK
Y=RCLICK
B=KEY:ESC
X=KEY:ENTER
Plus=KEY:ENTER
; - nao manda ESC: o ESC saia da tela de nome/fechava o jogo
Minus=KEYBOARD
L=KEY:SHIFT
R=KEY:TAB
; KEYBOARD = editor de nome: escreve um nome na caixa do jogo e o direcional edita
; (cima/baixo troca a letra, direita poe letra, esquerda apaga, Y sorteia, + ou X cria, B ou R3 sai).
; OSK = teclado do Autorun (com o D2GL ele abre mas nao aparece na tela)
L3=KEYBOARD
R3=KEYBOARD
Up=KEY:UP
Down=KEY:DOWN
Left=KEY:LEFT
Right=KEY:RIGHT

; valores em hexadecimal (RVA no D2Client.dll) para versoes desconhecidas/modificadas
[Offsets]
; Versao=1.13c

[AutoTest]
AutoJoin=0
AutoWalk=0
